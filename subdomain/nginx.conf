# ==============================================================================
# TRINEX SYSTEMS LLP - PRODUCTION SUBDOMAIN NGINX CONFIGURATION
# 1. Main Website: trinexsystems.com & www.trinexsystems.com -> trinex_fe
# 2. Admin Portal: admin.trinexsystems.com -> trinex_admin
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. MAIN CLIENT WEBSITE (trinexsystems.com)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen 443 ssl http2;
    server_name trinexsystems.com www.trinexsystems.com;

    # SSL Certificates (e.g. Let's Encrypt / Certbot)
    # ssl_certificate /etc/letsencrypt/live/trinexsystems.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/trinexsystems.com/privkey.pem;

    root /var/www/trinix/trinex_fe/dist;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
}

# ------------------------------------------------------------------------------
# 2. DEDICATED ADMIN PORTAL SUBDOMAIN (admin.trinexsystems.com)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen 443 ssl http2;
    server_name admin.trinexsystems.com;

    # SSL Certificates
    # ssl_certificate /etc/letsencrypt/live/admin.trinexsystems.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/admin.trinexsystems.com/privkey.pem;

    # Proxy all traffic to trinex_admin Express Backend on Port 5000
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # File upload size limit (allows up to 10MB images)
        client_max_body_size 10M;
    }

    # Static uploads folder caching
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
