# ==============================================================================
# TRINEX SYSTEMS LLP - PRODUCTION SUBDOMAIN NGINX CONFIGURATION
# 1. Main Website: trinexsystems.in & www.trinexsystems.in -> trinex_fe
# 2. Admin Portal: admin.trinexsystems.in -> trinex_admin
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. MAIN CLIENT WEBSITE (trinexsystems.in)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen 443 ssl http2;
    server_name trinexsystems.in www.trinexsystems.in;

    # SSL Certificates (e.g. Let's Encrypt / Certbot)
    # ssl_certificate /etc/letsencrypt/live/trinexsystems.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/trinexsystems.in/privkey.pem;

    root /var/www/trinix/trinex/dist;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Dynamic Sitemap & Robots from Backend
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:5000/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:5000/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API & Uploads
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5000/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # SEO-Complete SSR Product & Category Pages
    location = /products {
        proxy_pass http://127.0.0.1:5000/api/seo/render?route=products&$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/products/(.+)$ {
        proxy_pass http://127.0.0.1:5000/api/seo/render?route=product&slug=$1&$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
}

# ------------------------------------------------------------------------------
# 2. DEDICATED ADMIN PORTAL SUBDOMAIN (admin.trinexsystems.in)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen 443 ssl http2;
    server_name admin.trinexsystems.in;

    # SSL Certificates
    # ssl_certificate /etc/letsencrypt/live/admin.trinexsystems.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/admin.trinexsystems.in/privkey.pem;

    # Proxy all traffic to trinex_admin Express Backend on Port 5000
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # File upload size limit (allows up to 10MB images)
        client_max_body_size 10M;
    }

    # Static uploads folder caching
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
